<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Nota — a private notebook that stays on your device</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nota is a plain, private notebook. No account, no tracking. Your notes stay in your browser and export to Markdown."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Sets the theme before first paint (no flash). Its SHA-256 is pinned in vercel.json's CSP:
         if you change this script, run `npm run check:security` to get the new hash. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nota.theme');
          var d =
            t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
