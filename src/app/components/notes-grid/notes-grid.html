@for (note of store.filteredNotes(); track note.id) {
<app-note-card
  [note]="note"
  [selected]="note.id === store.selectedNoteId()"
  [shieldOn]="store.privacyShieldOn()"
  (selectNote)="store.selectNote(note.id)"
  (openNote)="store.openStudio(note.id)" />
} @empty {
<div class="p-5 text-center rounded-4 border" style="grid-column: 1 / -1; background: var(--bg-card); border-color: var(--border-color) !important;">
  <div class="mb-2" style="font-size: 2.1rem; color: var(--accent);">
    <i class="bi bi-journal-plus" aria-hidden="true"></i>
  </div>
  <h2 class="h6 fw-bold mb-1">No Notes in This View</h2>
  @if(store.activeView() !=='trash'){
  <p class="small mb-3" style="color: var(--text-secondary);">
    Create a standalone note right away (no folder needed) or clear your active search filter.
  </p>
  <button type="button" class="btn-accent" (click)="store.createNote()">
    <i class="bi bi-plus-lg" aria-hidden="true"></i> Create Note
  </button>
  }
</div>
}
