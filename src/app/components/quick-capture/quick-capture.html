<div class="quick-capture-bar">
  <i class="bi bi-feather" style="color: var(--accent); font-size: 1rem;" aria-hidden="true"></i>
  <input
    #titleInput
    type="text"
    class="quick-capture-input"
    placeholder="Quick capture a note title (Press Enter to save immediately without a folder)..."
    aria-label="Quick capture note title"
    (keydown.enter)="save(titleInput)"
  />
  <app-folder-select
    [small]="true"
    label="Optional folder for the quick-captured note"
    [value]="folder()"
    (valueChange)="folder.set($event)"
  />
  <button
    type="button"
    class="icon-btn fw-semibold"
    style="background: var(--accent-soft); color: var(--accent); font-size: 0.76rem; padding: 0.35rem 0.75rem;"
    (click)="save(titleInput)"
  >
    Save Card
  </button>
</div>
