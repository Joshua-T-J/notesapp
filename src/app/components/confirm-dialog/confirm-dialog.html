<dialog
  #dialog
  class="confirm-dialog"
  aria-labelledby="confirmTitle"
  aria-describedby="confirmMessage"
  (close)="onClose()"
  (click)="onBackdropClick($event, dialog)">
  @if (confirm.request(); as req) {
  <div class="confirm-body">
    <div class="confirm-icon" aria-hidden="true">
      <i class="bi bi-exclamation-triangle-fill"></i>
    </div>
    <div>
      <h2 id="confirmTitle" class="h6 fw-bold mb-1">{{ req.title }}</h2>
      <p id="confirmMessage" class="small mb-0 confirm-message">{{ req.message }}</p>
    </div>
  </div>
  <div class="confirm-actions">
    <button #cancelButton type="button" class="icon-btn border" (click)="confirm.answer(false)">
      {{ req.cancelLabel || 'Cancel' }}
    </button>
    <button type="button" class="confirm-danger" (click)="confirm.answer(true)">
      {{ req.confirmLabel || 'Delete' }}
    </button>
  </div>
  }
</dialog>
