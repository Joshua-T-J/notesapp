<div
  class="quick-action-dock"
  [class.visible]="visible()"
  [class.invisible]="!visible()"
  [attr.inert]="visible() ? null : ''"
  role="toolbar"
  aria-label="Selected note actions">
  @if (note(); as n) {
  <span class="small fw-semibold px-2 text-truncate" style="max-width: 170px; color: var(--text-primary);">{{ n.title || 'Untitled Note' }}</span>
  <div class="vr" style="color: var(--border-color);"></div>

  <button type="button" class="btn-accent py-1 px-3" style="font-size: 0.77rem;" (click)="store.openStudio(n.id)">
    <i class="bi bi-arrows-angle-expand" aria-hidden="true"></i> Open Note
  </button>

  <button
    type="button"
    class="icon-btn"
    [class.active]="n.pinned"
    [attr.aria-pressed]="n.pinned"
    (click)="store.togglePin(n.id)"
    title="Pin / Unpin"
    aria-label="Pin or unpin note">
    <i [class]="n.pinned ? 'bi bi-pin-fill' : 'bi bi-pin-angle'" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="icon-btn"
    [class.active]="n.sensitive"
    [attr.aria-pressed]="n.sensitive"
    (click)="store.toggleSensitive(n.id)"
    title="Mark Sensitive / Lock"
    aria-label="Mark note as sensitive">
    <i [class]="n.sensitive ? 'bi bi-shield-lock-fill' : 'bi bi-shield-lock'" aria-hidden="true"></i>
  </button>

  <app-folder-select
    [small]="true"
    placement="up"
    label="Assign folder or set to No Folder (Unfiled)"
    [value]="n.folder"
    (valueChange)="store.setFolder(n.id, $event)" />

  <button type="button" class="icon-btn" (click)="store.duplicateNote(n.id)" title="Duplicate Note" aria-label="Duplicate note">
    <i class="bi bi-copy" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="icon-btn"
    style="color: var(--danger);"
    (click)="store.requestDeleteNote(n.id)"
    [title]="n.trashed ? 'Delete Permanently' : 'Move to Trash'"
    [attr.aria-label]="n.trashed ? 'Delete note permanently' : 'Move note to trash'">
    <i class="bi bi-trash3" aria-hidden="true"></i>
  </button>

  <button type="button" class="icon-btn" (click)="store.clearSelection()" title="Deselect (Esc)" aria-label="Deselect note">
    <i class="bi bi-x-lg" aria-hidden="true"></i>
  </button>
  }
</div>
