<button
  #trigger
  type="button"
  role="combobox"
  class="dd-trigger"
  [class.compact]="compact()"
  aria-haspopup="listbox"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? listId : null"
  [attr.aria-activedescendant]="open() ? listId + '-' + activeIndex() : null"
  [attr.aria-label]="label() + ': ' + (selectedOption()?.label ?? '')"
  [title]="label()"
  (click)="toggle()"
  (keydown)="onKeydown($event)"
  (keyup.space)="$event.preventDefault()"
>
  @if (triggerIcon()) {
    <i class="bi dd-lead" [class]="triggerIcon()" aria-hidden="true"></i>
  }
  @if (selectedOption(); as selected) {
    @if (selected.color) {
      <span class="dd-dot" [style.background-color]="selected.color" aria-hidden="true"></span>
    } @else if (selected.icon) {
      <i class="bi dd-lead" [class]="selected.icon" aria-hidden="true"></i>
    }
    <span class="dd-label">{{ selected.label }}</span>
  }
  <i class="bi bi-chevron-down dd-chevron" aria-hidden="true"></i>
</button>

@if (open()) {
  <div
    class="dd-panel"
    [class.up]="placement() === 'up'"
    [class.end]="align() === 'end'"
    role="listbox"
    [id]="listId"
    [attr.aria-label]="label()"
  >
    @for (option of options(); track option.value; let i = $index) {
      <div
        class="dd-option"
        role="option"
        [id]="listId + '-' + i"
        [class.active]="i === activeIndex()"
        [class.selected]="option.value === value()"
        [attr.aria-selected]="option.value === value()"
        (click)="choose(option)"
        (mouseenter)="activeIndex.set(i)"
      >
        @if (option.color) {
          <span class="dd-dot" [style.background-color]="option.color" aria-hidden="true"></span>
        } @else if (option.icon) {
          <i class="bi dd-lead" [class]="option.icon" aria-hidden="true"></i>
        }
        <span class="dd-option-label">{{ option.label }}</span>
        @if (option.value === value()) {
          <i class="bi bi-check2 dd-check" aria-hidden="true"></i>
        }
      </div>
    }
  </div>
}
