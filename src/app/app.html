<div
  id="appShell"
  class="app-shell"
  [class.sidebar-collapsed]="!store.sidebarOpen()"
  [class.focus-mode]="store.focusMode()"
>
  <app-sidebar />

  <main class="pane-main">
    <app-notes-toolbar [attr.inert]="studioOpen() ? '' : null" />

    <!-- Clicking empty space deselects the current card (Esc does too). -->
    <div class="cards-scroll-area" [attr.inert]="studioOpen() ? '' : null" (click)="store.clearSelection()">
      @if (!store.isTrashView()) {
        <app-quick-capture />
      }
      <app-notes-grid />
    </div>

    <app-quick-action-dock />
    <app-note-studio />
  </main>
</div>

<app-reference-modal />
<app-confirm-dialog />
