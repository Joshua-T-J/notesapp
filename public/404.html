<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Nota</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #fafaf9; --ink: #18181a; --ink-2: #4e4e54; --line: #d6d5d1; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111113; --ink: #ededef; --ink-2: #b3b3b9; --line: #3a3a3f; } }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 18vh 24px 48px; }
      p { color: var(--ink-2); }
      a { display: inline-block; margin-right: 10px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>This page doesn’t exist</h1>
      <p>The link may be old or mistyped.</p>
      <a href="/">Home</a><a href="/app">Open Nota</a>
    </main>
  </body>
</html>
